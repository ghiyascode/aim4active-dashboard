server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # /admin, /terms and /privacy are client-side routes. /admin is ALSO a real
    # directory, because the data file lives under it. Matching $uri/ would make
    # nginx redirect /admin to /admin/ and serve a directory instead of the app,
    # so directories are deliberately not matched here.
    location / {
        try_files $uri /index.html;
    }

    # The data file must never be cached: it changes whenever the snapshot is
    # rebuilt, and a stale copy would silently show old figures.
    location = /admin/data/snapshot.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Hashed build assets are safe to cache for a long time.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Modest hardening for a site that serves no user input.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer" always;
}
